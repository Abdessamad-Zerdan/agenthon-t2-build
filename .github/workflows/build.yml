name: build-t2-image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        default: "v2"
      patch:
        description: "Apply patches/fhs.patch (true) or build the unchanged reference (false)"
        default: "true"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the organizers' public Track 2 starter (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: Agenthon-2026/track2-forecasting-public
          ref: a2c93e7b66b8c6a6c429fda81d6bc7873b7c5dec

      - name: Check out this repository (patches)
        uses: actions/checkout@v4
        with:
          path: _self

      - name: Apply forecaster patch
        if: ${{ inputs.patch == 'true' }}
        run: |
          git apply --verbose _self/patches/fhs.patch
          git diff --stat

      - name: Remove helper checkout from build context
        run: rm -rf _self

      - name: Image name (lowercase)
        id: name
        run: echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/agenthon-t2" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64, single manifest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.name.outputs.image }}:${{ inputs.tag }}

      - name: Smoke-run the built image on the worked example
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD/units/t2-F3-dollar-vortex-2022:/input:ro" -v "$PWD/_o:/output" \
            ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }} \
            forecast --panels /input --text /input/text --asof 2022-09-01 --card /input/card.toml --out /output/forecast.parquet || true
          ls -la _o || true
          head -12 _o/forecast_rationale.md || true

      - name: Show the digest
        run: |
          echo "IMAGE=${{ steps.name.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "DIGEST=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
