name: build-t2-image
on: workflow_dispatch

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the organizers' public Track 2 starter (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: Agenthon-2026/track2-forecasting-public
          ref: a2c93e7b66b8c6a6c429fda81d6bc7873b7c5dec

      - name: Image name (lowercase)
        id: name
        run: echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/agenthon-t2" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64, single manifest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.name.outputs.image }}:v1

      - name: Show the digest
        run: |
          echo "IMAGE=${{ steps.name.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "DIGEST=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
